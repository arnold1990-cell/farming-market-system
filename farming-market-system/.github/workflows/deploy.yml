name: Deploy Farming Market System

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/farming-market-system
            git pull origin master

            cd ~/farming-market-system/farming-market-system

            cat > .env <<'EOF'
            POSTGRES_USER=postgres
            POSTGRES_DB=farming_market
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

            DB_URL=jdbc:postgresql://postgres:5432/farming_market
            DB_USERNAME=postgres
            DB_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

            JPA_DDL_AUTO=update
            JPA_SHOW_SQL=false
            JPA_FORMAT_SQL=false
            JACKSON_TIMEZONE=UTC

            MULTIPART_MAX_FILE_SIZE=10MB
            MULTIPART_MAX_REQUEST_SIZE=50MB

            SERVER_PORT=8080

            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRATION_MS=86400000

            UPLOAD_BASE_DIR=uploads
            UPLOAD_PRODUCTS_DIR=uploads/products

            SPRINGDOC_API_DOCS_PATH=/v3/api-docs
            SPRINGDOC_SWAGGER_UI_PATH=/swagger-ui.html

            MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}
            VITE_API_BASE_URL=/api
            VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_TOKEN }}
            EOF

            cat > frontend/.env.production <<'EOF'
            VITE_API_BASE_URL=/api
            VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_TOKEN }}
            EOF

            sed -i 's/${POSTGRES_USER:postgres}/${POSTGRES_USER:-postgres}/g' docker-compose.yml || true
            sed -i 's/RUN npm run build/RUN NODE_OPTIONS=--max-old-space-size=1024 npm run build/' frontend/Dockerfile || true

            docker compose down --remove-orphans
            docker compose up -d --build
            docker compose ps
            curl -f http://localhost/api/products
            docker image prune -f
