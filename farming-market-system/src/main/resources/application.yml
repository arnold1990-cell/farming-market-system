spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:true}

  jackson:
    time-zone: ${JACKSON_TIMEZONE:UTC}

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:50MB}

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  upload:
    base-dir: ${UPLOAD_BASE_DIR:uploads}
    products-dir: ${UPLOAD_PRODUCTS_DIR:uploads/products}

  mapbox:
    token: ${MAPBOX_TOKEN}

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}

payments:
  orange-money:
    enabled: ${ORANGE_MONEY_ENABLED:false}
    base-url: ${ORANGE_MONEY_BASE_URL:}
    merchant-id: ${ORANGE_MONEY_MERCHANT_ID:}
    api-key: ${ORANGE_MONEY_API_KEY:}
    callback-url: ${ORANGE_MONEY_CALLBACK_URL:}
  myzaka:
    enabled: ${MYZAKA_ENABLED:false}
    base-url: ${MYZAKA_BASE_URL:}
    merchant-id: ${MYZAKA_MERCHANT_ID:}
    api-key: ${MYZAKA_API_KEY:}
    callback-url: ${MYZAKA_CALLBACK_URL:}
